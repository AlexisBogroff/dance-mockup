.ntf .b { display: flex; gap: 11px; margin-top: 9px; }

.ntf .thumb .tc { position: absolute; left: 4px; bottom: 4px; font: 700 8.5px ui-monospace, Menlo, monospace; color: #fff; background: rgba(0,0,0,.6); border-radius: 3px; padding: 1px 3px; z-index: 3; }
.ntf .thumb svg { position: absolute; inset: 0; z-index: 2; }
.ntf .voice { margin-top: 11px; padding: 7px 12px 7px 7px; background: rgba(255,128,8,.14); border-radius: 20px; }
.ntf .voice .play { width: 30px; height: 30px; }
.ntf .voice .wave { height: 22px; }
.ntf .voice .dur { color: var(--ref); }

.older .ap { width: 20px; height: 20px; border-radius: 6px; background: conic-gradient(from 200deg, var(--ref), #fff, var(--me), var(--ref)); flex: none; }

.qa { position: absolute; bottom: 52px; left: 46px; right: 46px; display: flex; justify-content: space-between; z-index: 20; }
.qa div { width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; }
