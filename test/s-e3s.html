<!doctype html><html lang="fr" class="proto" data-state="e3s"><head><meta name="viewport" content="width=390,user-scalable=no"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="dance.css"><link rel="stylesheet" href="lotb.css"><link rel="stylesheet" href="app.css">
<style>

.banner b { font-weight: 750; }

.center { text-align: center; }

.duo2 { display: flex; gap: 8px; }

.duo2 .take .cap2 { position: absolute; left: 8px; right: 8px; bottom: 8px; border-radius: 12px; padding: 7px 9px; font: 650 12px -apple-system, system-ui, sans-serif; background: rgba(0,0,0,.55); }
.duo2 .take .cap2 small { display: block; font: 500 10.5px -apple-system, system-ui, sans-serif; color: rgba(255,255,255,.75); }
.seg2 { display: flex; padding: 3px; border-radius: 12px; background: rgba(255,255,255,.08); }
.seg2 span { flex: 1; text-align: center; padding: 7px 0; border-radius: 9px; font: 650 13px -apple-system, system-ui, sans-serif; color: var(--t2); }
.seg2 span.on { background: #fff; color: #000; }
.player { position: absolute; left: 0; top: 0; width: 390px; height: 300px; overflow: hidden; background: #2a1d17; }
.player img { position: absolute; width: 100%; height: 100%; object-fit: cover; }
.player .pbar { position: absolute; left: 14px; right: 14px; bottom: 12px; display: flex; gap: 6px; }

.player .bigplay::after { content: ""; border-left: 20px solid #000; border-top: 12px solid transparent; border-bottom: 12px solid transparent; margin-left: 5px; }
.txt { font: 500 14px/1.5 -apple-system, system-ui, sans-serif; color: var(--t1); }
.player ~ .nav .ttl, .player ~ .nav .ttl small { text-shadow: 0 1px 6px rgba(0,0,0,.9); color: #fff; }
.qa { font: 500 13px/1.4 -apple-system, system-ui, sans-serif; color: var(--t2); }
</style><link rel="stylesheet" href="proto-frame.css"><style>

</div></div><script>try{document.querySelectorAll(".wave[data-n]").forEach(w=>{const n=+w.dataset.n,p=+(w.dataset.p||0),s=+(w.dataset.seed||1);for(let i=0;i<n;i++){const v=Math.abs(Math.sin(i*1.7+s)*Math.cos(i*.37+s*2));const b=document.createElement("i");b.style.height=(4+v*16)+"px";if(p)b.className=i/n<p?"past":"fut";w.appendChild(b)}})}catch(e){}</script><script src="flows.js"></script><script src="frame.js"></script></body></html>
