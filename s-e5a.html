<!doctype html><html lang="fr" class="proto" data-state="e5a"><head><meta name="viewport" content="width=390,user-scalable=no"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="dance.css">
<style>
/* Planche à deux téléphones : notes réduites */
html.phoneboard .board { padding: 20px 26px; gap: 26px; }
.notes { max-width: 370px; }
.notes h1 { font-size: 34px; margin: 8px 0 6px; }
.notes .screenname { font-size: 14.5px; margin-bottom: 12px; }
.notes li { font-size: 13.5px; line-height: 1.38; padding: 5px 0 5px 20px; }
.notes .test { font-size: 13px; padding: 12px 14px; margin-top: 12px; }
.notes .ref span { font-size: 11.5px; padding: 5px 9px; }

/* La caméra : Alexis entière dans le cadre (photo réduite, haut masqué par le voile) */
.cam { left: 0; top: 0; width: 390px; height: 844px; background: #0d0b0a; }
.cam .art { left: -265px; top: 190px; width: 920px; height: 613px; }
.cam .art img { filter: saturate(.8) contrast(1.04) brightness(.82); }
.cam .veil { background: linear-gradient(180deg, #07070A 0, #07070A 188px, rgba(7,7,10,.35) 232px, rgba(7,7,10,0) 290px, rgba(7,7,10,0) 760px, rgba(7,7,10,.7) 844px); }

.top { position: absolute; top: 56px; left: 14px; display: flex; gap: 8px; align-items: center; z-index: 20; }
.top .b { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font: 300 24px -apple-system, system-ui, sans-serif; }
.top .chip { height: 36px; font-size: 14px; padding: 0 14px; }

/* Consigne du cadre : lisible de loin */
.rule { position: absolute; top: 106px; left: 18px; width: 250px; z-index: 20; font: 750 22px/1.18 -apple-system, system-ui, sans-serif; letter-spacing: -.01em; color: #fff; }
.rule small { display: block; font: 600 13px -apple-system, system-ui, sans-serif; color: var(--t2); margin-top: 6px; letter-spacing: 0; }

/* Démo de Mike en vignette (orange) */
.pip { position: absolute; right: 14px; top: 58px; width: 100px; height: 140px; border-radius: 16px; z-index: 25; background: #2a1d17; box-shadow: 0 0 0 2px var(--ref), 0 10px 24px -8px rgba(0,0,0,.7); }
.pip .art { left: -60px; top: -3px; width: 220px; height: 147px; }
.pip .tag { position: absolute; left: 6px; bottom: 6px; z-index: 3; font: 800 10px ui-monospace, Menlo, monospace; letter-spacing: .06em; background: var(--ref); color: #121418; padding: 2px 6px; border-radius: 5px; }
.pip .pl { position: absolute; right: 6px; top: 6px; z-index: 3; width: 22px; height: 22px; border-radius: 50%; background: rgba(0,0,0,.55); display: grid; place-items: center; }
.pip .pl::after { content: ""; border-left: 7px solid #fff; border-top: 4.5px solid transparent; border-bottom: 4.5px solid transparent; margin-left: 2px; }

/* Le cadre fixe : quatre coins et la ligne des pieds (repère statique, aucune détection) */
.frame { position: absolute; left: 14px; right: 14px; top: 214px; height: 588px; z-index: 10; }
.frame i { position: absolute; width: 44px; height: 44px; border: 5px solid #fff; }
.frame i:nth-child(1) { left: 0; top: 0; border-width: 5px 0 0 5px; border-radius: 14px 0 0 0; }
.frame i:nth-child(2) { right: 0; top: 0; border-width: 5px 5px 0 0; border-radius: 0 14px 0 0; }
.frame i:nth-child(3) { left: 0; bottom: 0; border-width: 0 0 5px 5px; border-radius: 0 0 0 14px; }
.frame i:nth-child(4) { right: 0; bottom: 0; border-width: 0 5px 5px 0; border-radius: 0 0 14px 0; }
.floor { position: absolute; left: 62px; right: 62px; top: 794px; border-top: 3px dashed rgba(255,255,255,.85); z-index: 11; }
.floor span { position: absolute; right: -14px; top: -36px; white-space: nowrap; font: 700 13px -apple-system, system-ui, sans-serif; padding: 4px 10px; border-radius: 99px; background: rgba(0,0,0,.55); color: #fff; }

.metag { position: absolute; left: 30px; top: 230px; z-index: 12; font: 800 11px ui-monospace, Menlo, monospace; letter-spacing: .06em; background: var(--me); color: #fff; padding: 3px 7px; border-radius: 5px; }
/* État 1 : en attente de la voix */
.say { position: absolute; left: 28px; right: 28px; top: 380px; border-radius: 34px; padding: 24px 20px 22px; z-index: 30; text-align: center; }
.mic { width: 76px; height: 76px; margin: 0 auto; border-radius: 50%; background: #fff; display: grid; place-items: center; box-shadow: 0 0 0 10px rgba(255,255,255,.16), 0 0 0 22px rgba(255,255,255,.07); }
.mic svg { width: 34px; height: 34px; fill: none; stroke: #000; stroke-width: 2.2; stroke-linecap: round; }
.say b { display: block; font: 800 62px/1 ui-rounded, -apple-system, system-ui, sans-serif; letter-spacing: -.03em; margin-top: 26px; }
.say p { font: 600 18px/1.3 -apple-system, system-ui, sans-serif; color: rgba(255,255,255,.88); margin-top: 12px; }

/* État 2 : le compte à rebours */
.heard { position: absolute; left: 50%; transform: translateX(-50%); top: 262px; z-index: 30; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px 0 10px; border-radius: 99px; font: 700 17px -apple-system, system-ui, sans-serif; white-space: nowrap; }
.heard i { width: 24px; height: 24px; border-radius: 50%; background: #fff; color: #000; display: grid; place-items: center; font: 900 14px -apple-system, system-ui, sans-serif; font-style: normal; }
.count3 { position: absolute; left: 50%; top: 320px; transform: translateX(-50%); width: 300px; height: 300px; border-radius: 50%; z-index: 30; display: grid; place-items: center; }
.count3 b { font: 800 250px/1 ui-rounded, -apple-system, system-ui, sans-serif; letter-spacing: -.06em; color: #fff; margin-top: -14px; margin-left: -10px; }
.count3 svg { position: absolute; inset: -8px; }
.next { position: absolute; left: 50%; transform: translateX(-50%); top: 640px; z-index: 30; white-space: nowrap; font: 750 22px -apple-system, system-ui, sans-serif; padding: 10px 20px; border-radius: 99px; }
